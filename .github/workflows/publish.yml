name: Publish to PyPI

# Versioning is done by verwalter (https://github.com/lukasIO/verwalter):
# contributors add .changeset/*.md files, release-pr.yml opens one release
# PR per package, and merging it runs this workflow. Order: tag and GitHub
# release first, then build, then publish (the step that cannot be undone).
on:
  pull_request:
    types: [closed]
    branches: [main]
  # Re-run by hand: `verwalter release` resumes from the current state.
  workflow_dispatch:
    inputs:
      package:
        description: Only this package; always reported to the publish jobs.
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  # ── Tag and GitHub release ────────────────────────────────────
  tag:
    name: Tag and release
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.verwalter.outputs.releases }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 0
      - id: verwalter
        uses: lukasIO/verwalter@v0.10.0
        with:
          command: release
          args: ${{ inputs.package && format('--package {0}', inputs.package) || '' }}

  # ── RTC builds (multi-platform) ──────────────────────────────
  build-rtc:
    name: Build RTC wheels (${{ matrix.archs }})
    needs: tag
    if: contains(needs.tag.outputs.releases, '"package":"livekit"')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: namespace-profile-default-arm64
            archs: aarch64
          - os: windows-latest
            archs: AMD64
          - os: macos-latest
            archs: x86_64 arm64
    defaults:
      run:
        working-directory: ./livekit-rtc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        id: setup-python
        with:
          python-version: "3.11"

      - name: Build wheels
        run: pipx run --python '${{ steps.setup-python.outputs.python-path }}' cibuildwheel==3.3.1 --output-dir dist
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-rtc-${{ matrix.os }}
          path: livekit-rtc/dist/*.whl

  build-rtc-sdist:
    name: Build RTC sdist
    needs: tag
    if: contains(needs.tag.outputs.releases, '"package":"livekit"')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./livekit-rtc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: true

      - name: Build sdist
        run: |
          pip3 install build
          python3 -m build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-rtc-sdist
          path: livekit-rtc/dist/*.tar.gz

  publish-rtc:
    name: Publish livekit (RTC)
    needs: [tag, build-rtc, build-rtc-sdist]
    if: contains(needs.tag.outputs.releases, '"package":"livekit"')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dist-rtc-*
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # ── API build ────────────────────────────────────────────────
  build-api:
    name: Build API
    needs: tag
    if: contains(needs.tag.outputs.releases, '"package":"livekit-api"')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./livekit-api
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7

      - name: Build wheel & sdist
        run: |
          pip3 install build wheel
          python3 -m build --wheel --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-api
          path: |
            livekit-api/dist/*.whl
            livekit-api/dist/*.tar.gz

  publish-api:
    name: Publish livekit-api
    needs: [tag, build-api]
    if: contains(needs.tag.outputs.releases, '"package":"livekit-api"')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-api
          path: dist/

      - name: List distributions
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # ── Protocol build ───────────────────────────────────────────
  build-protocol:
    name: Build Protocol
    needs: tag
    if: contains(needs.tag.outputs.releases, '"package":"livekit-protocol"')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./livekit-protocol
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7

      - name: Build wheel & sdist
        run: |
          pip3 install build wheel
          python3 -m build --wheel --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-protocol
          path: |
            livekit-protocol/dist/*.whl
            livekit-protocol/dist/*.tar.gz

  publish-protocol:
    name: Publish livekit-protocol
    needs: [tag, build-protocol]
    if: contains(needs.tag.outputs.releases, '"package":"livekit-protocol"')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-protocol
          path: dist/

      - name: List distributions
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # ── Docs ─────────────────────────────────────────────────────
  docs-rtc:
    name: Build RTC docs
    needs: [tag, publish-rtc]
    if: contains(needs.tag.outputs.releases, '"package":"livekit"')
    uses: ./.github/workflows/build-docs.yml
    with:
      package_dir: livekit-rtc
      package_name: livekit.rtc
    secrets: inherit

  docs-api:
    name: Build API docs
    needs: [tag, publish-api]
    if: contains(needs.tag.outputs.releases, '"package":"livekit-api"')
    uses: ./.github/workflows/build-docs.yml
    with:
      package_dir: livekit-api
      package_name: livekit.api
    secrets: inherit

  docs-protocol:
    name: Build Protocol docs
    needs: [tag, publish-protocol]
    if: contains(needs.tag.outputs.releases, '"package":"livekit-protocol"')
    uses: ./.github/workflows/build-docs.yml
    with:
      package_dir: livekit-protocol
      package_name: livekit.protocol
    secrets: inherit
